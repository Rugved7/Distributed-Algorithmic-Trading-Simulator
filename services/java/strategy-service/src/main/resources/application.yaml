spring:
  application:
    name: strategy-service

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT_MS:2000}ms

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    client-id: ${KAFKA_CLIENT_ID:strategy-service}
    consumer:
      group-id: ${KAFKA_GROUP_ID:strategy-service}
      auto-offset-reset: earliest
      enable-auto-commit: false
    producer:
      acks: all
      retries: 5
      properties:
        enable.idempotence: true

server:
  port: ${SERVER_PORT:8082}

grpc:
  server:
    port: ${GRPC_SERVER_PORT:9092}

topics:
  strategy-triggered: ${TOPIC_STRATEGY_TRIGGERED:strategy-triggered}
  ai-analysis-requested: ${TOPIC_AI_ANALYSIS_REQUESTED:ai-analysis-requested}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  level:
    root: INFO
